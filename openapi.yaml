        fold:
          description: |
            The key an alias for this value is written under. Two published
            values sharing one fold already resolve alike.
          type: string
        offer_count:
          type: integer
          format: int64
        canonical:
          description: What matching resolves the value to, null where no alias does.
          type: string
          format: null-string
