        enum_values:
          description: Replaces the stored list; order is the order given.
          type: array
          items:
            type: string

    CrmAttributeSaved:
      type: object
      required: [attribute, run_ids]
      properties:
        attribute:
          $ref: "#/components/schemas/CrmAttribute"
        run_ids:
          description: A rehash per product type the edit invalidated.
          type: array
          items:
            type: string
            format: uuid
          x-go-name: RunIDs

    CrmAttributeValues:
      type: object
