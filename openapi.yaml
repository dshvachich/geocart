          type: string
          enum: [enum, string, int, decimal, bool, set]
        unit:
          description: Empty on everything but a numeric attribute.
          type: string
        description:
          description: What the model reads to decide what the attribute means.
          type: string
        enum_values:
          description: |
            The codes an enumerated attribute accepts, in their order, empty
