openapi: 3.0.3
info:
  title: marketi
  version: "1"
servers:
  - url: /api

paths:
  /categories:
    get:
      operationId: listCategories
      description: |
        Отсортированный список категорий со всеми подкатегориями
      parameters:
        - $ref: '#/components/parameters/AcceptLocale'
      responses:
        "200":
          description: Список категорий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'

  /products:
    get:
      operationId: listProducts
      description: |
        Список популярных продуктов.
      parameters:
        - $ref: '#/components/parameters/AcceptLocale'
        - name: ids
          in: query
          required: false
          explode: false
          schema:
            type: array
            items:
              type: integer
              format: int64
        - name: limit
          required: true
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            x-go-type: uint64
        - name: sort
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/ProductSort'
        - name: sortOrder
          required: false
          in: query
          schema:
            $ref: '#/components/schemas/SortOrder'
        - name: cursor
          required: false
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Список продуктов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductListResponse'
        "400":
          $ref: '#/components/responses/ErrorResponse'

  /products/{slug}:
    get:
      operationId: getProduct
      description: |
        Детальная карточка продукта
      parameters:
        - $ref: '#/components/parameters/AcceptLocale'
        - in: path
          name: slug
          required: true
          schema:
            type: string
            pattern: '^(?:.*-p)?[0-9]+$'
          examples:
            slug:
              value: apple-iphone-17-pro-p12321
            id:
              value: "12321"
      responses:
        "200":
          description: |
            Детальная карточка продукта
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        "400":
          $ref: '#/components/responses/ErrorResponse'
        "404":
          $ref: '#/components/responses/ErrorResponse'

  /search:
    get:
      operationId: searchProducts
      description: |
        Поиск продуктов по тексту и/или фильтрам.
        Продукты всегда возвращаются в рамках одной из категорий для поддержания корректности
        фильтров. Также возвращаются возможные категории продуктов и выбранная категория,
        по которой происходит поиск.

        При запросе с фильтрами всегда необходимо указывать категорию.

        Возможные фильтры, их названия и типы полностью определяются тем, что ответил сервер.
        Их нужно указывать как `f[id]=X`, например `f[price]=100-200&f[color]=red,blue`.
        Каждый фильтр в ответе имеет указатель на то, были ли выбраны какие-то значения для этого фильтра при запросе.
        Так на стороне клиента должны отсекаться невалидные значения, сужения фильтров и так далее: логика формирования фильтров
        и действующих значений полностью находится на стороне сервера.

        Правила наименований фильтров при использовании в запросе:
          - Типы фильтров: `checkbox`, `range`, `toggle`.
          - `checkbox`: фильтры предполагают выбор нескольких предложенных значений.
          В качестве сепаратора значения использовать `,`, например: `brand=Apple,Samsung'
          - `range`: фильтр предполагает выбор из минимального и максимального значения какого-то числового
          параметра для поиска. `min` и `max` из ответа указывают на минимальные и максимальные значения по всему корпусу.
          При применении данного фильтра необходимо **всегда присылать оба значения** в виде: `{selectedMin}-{selectedMax}`,
          заменяя невыбранные границами всего корпуса, которые пришли в ответе.
          - `toggle`: простой фильтр `true/false`. Отправлять как `true/false`.
      parameters:
        - $ref: '#/components/parameters/AcceptLocale'
        - name: q
          in: query
          description: Текст запроса
          required: false
          schema:
            type: string
        - name: category
          in: query
          description: Категория поиска. Принимаются только конечные категории
          required: false
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            x-go-type: uint64
        - name: sort
          in: query
          schema:
            $ref: '#/components/schemas/ProductSort'
        - name: sortOrder
          in: query
          description: Направление сортировки. По умолчанию - по убыванию
          schema:
            $ref: '#/components/schemas/SortOrder'
        - name: cursor
          in: query
          schema:
            type: string
        - name: f
          in: query
          description: Фильтры в формате `f[x]=value1,value2`, `f[x]=value1-value2`
          style: deepObject
          explode: true
          schema:
            type: object
            additionalProperties:
              type: string
      responses:
        "200":
          description: |
            Список продуктов по запросу, подходящих категорий и фильтров
            по выбранной или предсказанной категории.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        "400":
          $ref: '#/components/responses/ErrorResponse'
        "404":
          $ref: '#/components/responses/ErrorResponse'

  /search/suggest:
    get:
      operationId: listSuggestions
      description: |
        Подсказки для поиска
      parameters:
        - $ref: '#/components/parameters/AcceptLocale'
        - name: q
          in: query
          description: Текст запроса
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: true
          description: Максимум подсказок в каждой группе
          schema:
            type: integer
            minimum: 1
            maximum: 50
            x-go-type: uint64
      responses:
        "200":
          description: |
            Подсказки, сгруппированные по типу сущности. Группа присутствует
            всегда, даже если она пуста.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSuggestion'
        "400":
          $ref: '#/components/responses/ErrorResponse'

components:
  responses:
    ErrorResponse:
      description: Общая ошибка
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  parameters:
    AcceptLocale:
      name: "Accept-Locale"
      in: header
      required: false
      schema:
        type: string
        enum: [ru, en, ka]
        x-go-type: store.Language

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: object
          additionalProperties: true

    Cursor:
      type: object
      properties:
        next:
          type: string
          nullable: true
          format: null-string

    CategoryList:
      type: array
      items:
        $ref: '#/components/schemas/Category'

    Category:
      type: object
      required: [id, label, imageUrl, type]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [normal, button]
        label:
          type: string
        imageUrl:
          type: string
          format: null-string
          nullable: true
        subCategories:
          type: array
          items:
            $ref: '#/components/schemas/Category'

    ProductListResponse:
      type: object
      required: [cursor, products]
      properties:
        cursor:
          $ref: '#/components/schemas/Cursor'
        products:
          $ref: '#/components/schemas/ProductList'

    ProductList:
      type: array
      items:
        $ref: '#/components/schemas/ProductListItem'

    ProductListItem:
      type: object
      required: [id, slug, name, minPriceTetri, offersCount, imageUrls, isNew]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        minPriceTetri:
          type: integer
        offersCount:
          type: integer
        imageUrls:
          type: array
          items:
            type: string
        isNew:
          type: boolean

    SearchSuggestionCategory:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string

    SearchSuggestionProduct:
      type: object
      required: [id, slug, label]
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        label:
          type: string

    SearchSuggestion:
      type: object
      required: [categories, products]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/SearchSuggestionCategory'
        products:
          type: array
          items:
            $ref: '#/components/schemas/SearchSuggestionProduct'

    ProductSummaryAttribute:
      type: object
      required: [id, label, value]
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: string

    SearchProductListItem:
      allOf:
        - $ref: '#/components/schemas/ProductListItem'
        - type: object
          required: [summary]
          properties:
            summary:
              type: array
              description: |
                Ключевые атрибуты продукта, отрендеренные по схеме его типа.
                Пусты, если категория поиска не определена.
              items:
                $ref: '#/components/schemas/ProductSummaryAttribute'

    SearchResponse:
      type: object
      required: [title, products, filters, categories, cursor]
      properties:
        title:
          type: string
        products:
          type: array
          items:
            $ref: '#/components/schemas/SearchProductListItem'
        filters:
          type: array
          items:
            $ref: '#/components/schemas/SearchFilter'
        categories:
          type: array
          items:
            $ref: '#/components/schemas/SearchCategory'
        cursor:
          $ref: '#/components/schemas/Cursor'

    SearchCategory:
      type: object
      required: [id, label, selected, imageUrl]
      properties:
        id:
          type: string
        label:
          type: string
        selected:
          type: boolean
        imageUrl:
          type: string
          format: url
          x-go-type: null.String

    SearchFilter:
      type: object
      required: [type]
      oneOf:
        - $ref: '#/components/schemas/SearchFilterRange'
        - $ref: '#/components/schemas/SearchFilterSelectable'
      discriminator:
        propertyName: type
        mapping:
          checkbox: '#/components/schemas/SearchFilterSelectable'
          toggle: '#/components/schemas/SearchFilterSelectable'
          range: '#/components/schemas/SearchFilterRange'

    SearchFilterType:
      type: string
      enum: [checkbox, toggle, range]

    SearchFilterVariant:
      type: object
      required: [value, label, selected]
      properties:
        value:
          type: string
        label:
          type: string
        selected:
          type: boolean

    SearchFilterSelectable:
      type: object
      required: [type, id, label, variants]
      properties:
        type:
          type: string
          enum: [checkbox, toggle]
        id:
          type: string
        label:
          type: string
        variants:
          type: array
          items:
            $ref: '#/components/schemas/SearchFilterVariant'

    SearchFilterRange:
      type: object
      required: [type, id, label, min, max, selectedMin, selectedMax]
      properties:
        type:
          type: string
          enum: [range]
        id:
          type: string
        label:
          type: string
        min:
          type: integer
        max:
          type: integer
        selectedMin:
          type: integer
        selectedMax:
          type: integer

    CategoryBreadcrumb:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string

    Product:
      type: object
      required: [id, displayCode, slug, name, isNew, description, imageUrls, offers, attributes, summary, categoryBreadcrumbs, variants]
      properties:
        id:
          type: integer
          format: int64
        displayCode:
          type: string
          description: |
            Человекочитаемый код продукта для поиска и поддержки.
        slug:
          type: string
          description: |
            Канонический адрес продукта. Если не совпадает со слагом из запроса,
            клиенту следует сделать 301 на канонический.
        name:
          type: string
        description:
          type: string
        imageUrls:
          type: array
          items:
            type: string
        isNew:
          type: boolean
        categoryBreadcrumbs:
          type: array
          items:
            $ref: '#/components/schemas/CategoryBreadcrumb'
        offers:
          type: array
          items:
            $ref: '#/components/schemas/ProductOffer'
        attributes:
          $ref: '#/components/schemas/ProductAttributeList'
        summary:
          type: array
          description: |
            Ключевые атрибуты продукта, отрендеренные по схеме его типа.
          items:
            $ref: '#/components/schemas/ProductSummaryAttribute'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariantGroup'

    ProductVariantGroup:
      type: object
      required: [id, label, options]
      properties:
        id:
          type: string
        label:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/ProductVariantOption'

    ProductVariantOption:
      type: object
      required: [productId, slug, label, selected, exact]
      properties:
        productId:
          type: integer
          format: int64
        slug:
          type: string
        label:
          type: string
        selected:
          type: boolean
        exact:
          type: boolean

    ProductOffer:
      type: object
      required: [id, merchant, url, priceTetri, originalPriceTetri, ratioToBestPrice, updatedAt]
      properties:
        id:
          type: integer
          format: int64
        merchant:
          $ref: '#/components/schemas/ProductOfferMerchant'
        url:
          type: string
        updatedAt:
          type: string
          format: date-time
        priceTetri:
          type: integer
        originalPriceTetri:
          type: integer
        ratioToBestPrice:
          type: number
          format: float

    ProductOfferMerchant:
      type: object
      required: [id, name, url, logoUrl, phone]
      properties:
        id:
          type: string
        name:
          type: string
        url:
          type: string
        logoUrl:
          type: string
        phone:
          type: string
          format: null-string

    ProductAttributeList:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttributeGroup'

    ProductAttributeGroup:
      type: object
      required: [id, label, attributes]
      properties:
        id:
          type: string
        label:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttribute'

    ProductAttribute:
      type: object
      required: [id, label, value]
      properties:
        id:
          type: string
        label:
          type: string
        value:
          type: string

    ProductSort:
      type: string
      enum: [popularity, price]
      default: popularity
      x-go-type: store.ProductSort

    SortOrder:
      type: string
      enum: [asc, desc]
      default: desc
      x-go-type: paging.Order
